# Kubernetes Secrets
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: like2share
type: Opaque
stringData:
  username: like2share_user
  password: CHANGE_ME_IN_PRODUCTION # Base64 encode this in production
  database: like2share_db
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: like2share
type: Opaque
stringData:
  jwt-secret: CHANGE_ME_IN_PRODUCTION # Base64 encode this in production
  database-url: postgres://like2share_user:CHANGE_ME_IN_PRODUCTION@postgres:5432/like2share_db?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: like2share-secrets
  namespace: like2share
type: Opaque
stringData:
  database-url: postgresql://like2share_user:CHANGE_ME_IN_PRODUCTION@postgres:5432/like2share_db
  openai-api-key: CHANGE_ME_IN_PRODUCTION # Your OpenAI API key
  backend-api-key: CHANGE_ME_IN_PRODUCTION # API key for chatbot-backend communication
