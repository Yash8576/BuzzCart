apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: like2share
  labels:
    app: chatbot
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
        tier: api
    spec:
      containers:
      - name: chatbot
        image: like2share/chatbot:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: like2share-secrets
              key: database-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: like2share-secrets
              key: openai-api-key
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: BACKEND_API_URL
          value: "http://backend:8080"
        - name: BACKEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: like2share-secrets
              key: backend-api-key
        - name: CHROMA_PERSIST_DIR
          value: "/app/data/embeddings"
        - name: DOCUMENTS_PATH
          value: "/app/data/documents"
        - name: DEBUG
          value: "false"
        - name: ENV
          value: "production"
        volumeMounts:
        - name: chatbot-documents
          mountPath: /app/data/documents
        - name: chatbot-embeddings
          mountPath: /app/data/embeddings
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: chatbot-documents
        persistentVolumeClaim:
          claimName: chatbot-documents-pvc
      - name: chatbot-embeddings
        persistentVolumeClaim:
          claimName: chatbot-embeddings-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatbot-documents-pvc
  namespace: like2share
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatbot-embeddings-pvc
  namespace: like2share
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
