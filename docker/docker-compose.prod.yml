# Docker Compose - Production Environment
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: like2share_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-like2share_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-like2share_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-like2share_user} -d ${POSTGRES_DB:-like2share_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: like2share_backend_prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-like2share_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-like2share_db}?sslmode=require
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/app/media
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: like2share_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - chatbot
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/usr/share/nginx/html/media:ro

  redis:
    image: redis:7-alpine
    container_name: like2share_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  chatbot:
    build:
      context: ../chatbot
      dockerfile: Dockerfile
    container_name: like2share_chatbot_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-like2share_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-like2share_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8080
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      CHROMA_PERSIST_DIR: /app/data/embeddings
      DOCUMENTS_PATH: /app/data/documents
      DEBUG: "false"
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - chatbot_documents:/app/data/documents
      - chatbot_embeddings:/app/data/embeddings
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chatbot_documents:
    driver: local
  chatbot_embeddings:
    driver: local

networks:
  like2share_network:
    driver: bridge
