# Docker Compose - Production Environment
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: like2share_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-like2share_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-like2share_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-like2share_user} -d ${POSTGRES_DB:-like2share_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: like2share_backend_prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-like2share_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-like2share_db}?sslmode=require
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/app/media
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: like2share_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - chatbot
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/usr/share/nginx/html/media:ro

  redis:
    image: redis:7-alpine
    container_name: like2share_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    container_name: like2share_ollama_prod
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 3G

  ollama-init:
    image: ollama/ollama:latest
    container_name: like2share_ollama_init_prod
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-mistral}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ollama_data:/root/.ollama

  chatbot:
    build:
      context: ../chatbot
      dockerfile: Dockerfile
    container_name: like2share_chatbot_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-like2share_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-like2share_db}
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      RERANKER_MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      VECTOR_STORE_DIR: /app/data/vector_store
      DOCUMENTS_PATH: /app/data/documents
      MODEL_CACHE_DIR: /app/models/cache
      RETRIEVAL_CANDIDATE_POOL: 24
      LEXICAL_SEARCH_LIMIT: 24
      NEIGHBOR_WINDOW: 1
      MAX_EVIDENCE_BLOCKS: 3
      DOCUMENT_URL_REWRITE_FROM: '["localhost","127.0.0.1","10.0.2.2"]'
      DOCUMENT_URL_REWRITE_TO: minio:9000
      DEBUG: "false"
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - like2share_network
    volumes:
      - chatbot_documents:/app/data/documents
      - chatbot_vector_store:/app/data/vector_store
      - chatbot_model_cache:/app/models/cache
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chatbot_documents:
    driver: local
  chatbot_vector_store:
    driver: local
  chatbot_model_cache:
    driver: local
  ollama_data:
    driver: local

networks:
  like2share_network:
    driver: bridge
