# Docker Compose - Development Environment
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: like2share_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: like2share_user
      POSTGRES_PASSWORD: like2share_dev_password
      POSTGRES_DB: like2share_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U like2share_user -d like2share_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: like2share_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://like2share_user:like2share_dev_password@postgres:5432/like2share_db?sslmode=disable
      JWT_SECRET: dev_jwt_secret_change_in_production
      PORT: 8080
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: buzzcart-media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/app/media

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: like2share_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - like2share_network

  redis:
    image: redis:7-alpine
    container_name: like2share_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: like2share_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    container_name: like2share_ollama_init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-mistral}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ollama_data:/root/.ollama

  minio:
    image: minio/minio:latest
    container_name: like2share_minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatbot:
    build:
      context: ../chatbot
      dockerfile: Dockerfile
    container_name: like2share_chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://like2share_user:like2share_dev_password@postgres:5432/like2share_db
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      RERANKER_MODEL_NAME: BAAI/bge-reranker-v2-m3
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      VECTOR_STORE_DIR: /app/data/vector_store
      DOCUMENTS_PATH: /app/data/documents
      MODEL_CACHE_DIR: /app/models/cache
      RETRIEVAL_CANDIDATE_POOL: 24
      LEXICAL_SEARCH_LIMIT: 24
      NEIGHBOR_WINDOW: 1
      MAX_EVIDENCE_BLOCKS: 3
      DOCUMENT_URL_REWRITE_FROM: '["localhost","127.0.0.1","10.0.2.2"]'
      DOCUMENT_URL_REWRITE_TO: minio:9000
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - like2share_network
    volumes:
      - chatbot_documents:/app/data/documents
      - chatbot_vector_store:/app/data/vector_store
      - chatbot_model_cache:/app/models/cache

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  chatbot_documents:
    driver: local
  chatbot_vector_store:
    driver: local
  chatbot_model_cache:
    driver: local
  ollama_data:
    driver: local

networks:
  like2share_network:
    driver: bridge
