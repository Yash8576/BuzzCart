# Docker Compose - Development Environment
version: '3.9'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: like2share_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../backend/.env
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      FIREBASE_STORAGE_CREDENTIALS_FILE: /app/firebase-credentials.json
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/app/media
      - C:/Users/dravi/Downloads/buzzcart-daeb6-98c5aac24eb0.json:/app/firebase-credentials.json:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: like2share_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - like2share_network

  redis:
    image: redis:7-alpine
    container_name: like2share_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: like2share_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    container_name: like2share_ollama_init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-mistral}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ollama_data:/root/.ollama

  chatbot:
    build:
      context: ../chatbot
      dockerfile: Dockerfile
    container_name: like2share_chatbot
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../chatbot/.env
    environment:
      API_PORT: 8001
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      RERANKER_MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      VECTOR_STORE_DIR: /app/data/vector_store
      DOCUMENTS_PATH: /app/data/documents
      ALLOWED_EXTENSIONS: '[".pdf",".txt",".md",".docx",".html"]'
      MODEL_CACHE_DIR: /app/models/cache
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8080
      RETRIEVAL_CANDIDATE_POOL: 24
      LEXICAL_SEARCH_LIMIT: 24
      NEIGHBOR_WINDOW: 1
      MAX_EVIDENCE_BLOCKS: 3
      DOCUMENT_URL_REWRITE_FROM: '["localhost","127.0.0.1","10.0.2.2"]'
      DOCUMENT_URL_REWRITE_TO: firebasestorage.googleapis.com
      DEBUG: "true"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - like2share_network
    volumes:
      - chatbot_documents:/app/data/documents
      - chatbot_vector_store:/app/data/vector_store
      - chatbot_model_cache:/app/models/cache

volumes:
  redis_data:
    driver: local
  chatbot_documents:
    driver: local
  chatbot_vector_store:
    driver: local
  chatbot_model_cache:
    driver: local
  ollama_data:
    driver: local

networks:
  like2share_network:
    driver: bridge
