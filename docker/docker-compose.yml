# Docker Compose - Development Environment
version: '3.9'

services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.20.0
    container_name: like2share_cloudsql_proxy
    restart: unless-stopped
    command:
      - "--address"
      - "0.0.0.0"
      - "--port"
      - "5432"
      - "--credentials-file"
      - "/secrets/cloudsql-service-account.json"
      - "buzzcart-daeb6:us-east4:buzzcart-daeb6-instance"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - C:/Users/dravi/Downloads/buzzcart-daeb6-ad1d37ed4a79.json:/secrets/cloudsql-service-account.json:ro
    networks:
      - like2share_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: like2share_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgres://buzzcart_app:C%29%3FRl%29rjecxpzF%3FH@cloudsql-proxy:5432/buzzcart-daeb6-database?sslmode=disable
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      FIREBASE_STORAGE_CREDENTIALS_FILE: /app/firebase-credentials.json
    depends_on:
      cloudsql-proxy:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ../storage/media:/app/media
      - C:/Users/dravi/Downloads/buzzcart-daeb6-98c5aac24eb0.json:/app/firebase-credentials.json:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: like2share_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - like2share_network

  redis:
    image: redis:7-alpine
    container_name: like2share_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - like2share_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: like2share_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - like2share_network
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    container_name: like2share_ollama_init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-mistral}"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - like2share_network
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  chatbot:
    build:
      context: ../chatbot
      dockerfile: Dockerfile
      args:
        TORCH_WHEEL_CHANNEL: ${TORCH_WHEEL_CHANNEL:-cu128}
    container_name: like2share_chatbot
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../chatbot/.env
    environment:
      API_PORT: 8001
      DATABASE_URL: postgresql://buzzcart_chatbot_ro:N7vQ2pLm8sTx4kRf@cloudsql-proxy:5432/buzzcart-daeb6-database?sslmode=disable
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      RERANKER_MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      MODEL_DEVICE_INDEX: ${MODEL_DEVICE_INDEX:-0}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-24}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      VECTOR_STORE_DIR: /app/data/vector_store
      DOCUMENTS_PATH: /app/data/documents
      ALLOWED_EXTENSIONS: '[".pdf",".txt",".md",".docx",".html"]'
      MODEL_CACHE_DIR: /app/models/cache
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8080
      RETRIEVAL_CANDIDATE_POOL: 24
      LEXICAL_SEARCH_LIMIT: 24
      NEIGHBOR_WINDOW: 1
      MAX_EVIDENCE_BLOCKS: 3
      DIRECT_SEARCH_TOP_K: 14
      DIRECT_MATCH_MIN_SCORE: 0.58
      DOCUMENT_URL_REWRITE_FROM: '["localhost","127.0.0.1","10.0.2.2"]'
      DOCUMENT_URL_REWRITE_TO: firebasestorage.googleapis.com
      DEBUG: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    depends_on:
      cloudsql-proxy:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - like2share_network
    volumes:
      - chatbot_documents:/app/data/documents
      - chatbot_vector_store:/app/data/vector_store
      - chatbot_model_cache:/app/models/cache
    gpus: all

volumes:
  redis_data:
    driver: local
  chatbot_documents:
    driver: local
  chatbot_vector_store:
    driver: local
  chatbot_model_cache:
    driver: local
  ollama_data:
    driver: local

networks:
  like2share_network:
    driver: bridge
